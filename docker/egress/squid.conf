# Egress proxy for the Playwright MCP browser (ADR 0008, architecture r1 "Browser network boundary").
# Deny everything except the hosts in the per-attempt allowlist the worker writes
# to /etc/squid/allow/allowlist.txt (one host name per line). The file is read on
# every new destination by the helper below (ttl=0), so no reconfigure is needed.
http_port 3128

external_acl_type attempt_allowlist ttl=0 negative_ttl=0 children-max=2 children-startup=1 %DST /etc/squid/allowlist-helper.pl
acl allowed_host external attempt_allowlist
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_host
http_access deny all

# No caching, no forwarding headers that reveal the browser, no cache manager.
cache deny all
cache_mem 0 MB
forwarded_for delete
via off
httpd_suppress_version_string on
access_log stdio:/var/log/squid/access.log
