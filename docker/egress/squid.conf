# Egress proxy for the Playwright MCP browser (ADR 0008, architecture r1 "Browser network boundary").
# Deny everything except the hosts in the per-attempt allowlist the worker writes
# to /etc/squid/allow/allowlist.txt (one host name per line). The file is read on
# every new destination by the helper below (ttl=0), so no reconfigure is needed.
http_port 3128

# Resolve names to IPv4 first so the destination checked below is the one used.
dns_v4_first on

external_acl_type attempt_allowlist ttl=0 negative_ttl=0 children-max=2 children-startup=1 %DST /etc/squid/allowlist-helper.pl
acl allowed_host external attempt_allowlist
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
# SSRF guard: never reach private, loopback, link-local or metadata addresses, even for
# an allowlisted name. Checked against the resolved address, so it must stay BEFORE the
# allow rule. The list file is mounted per environment; a missing file stops Squid
# starting (fail closed). Only the test overlay swaps in a relaxed list.
acl private_dst dst "/etc/squid/deny-private-dst.txt"

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny private_dst
http_access allow allowed_host
http_access deny all

# No caching, no forwarding headers that reveal the browser, no cache manager.
cache deny all
cache_mem 0 MB
forwarded_for delete
via off
httpd_suppress_version_string on
access_log stdio:/var/log/squid/access.log
