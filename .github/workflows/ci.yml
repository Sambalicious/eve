# CI for pull requests and pushes to main. Checks only: no secrets, no deploys.
# Run the same commands locally: see the "CI" section of README.md.
#
# The changes job runs scripts/ci/changes.mjs first and the other jobs run only
# when the diff needs them: a docs-only change runs the agent checks alone, a
# web-only change skips the api integration and image jobs, and turbo filters to
# the changed packages and their dependents. The lockfile, root build config and
# this directory run everything. A nightly run checks all of main once a day it
# changed. See what a branch would run: node scripts/ci/changes.mjs --base origin/main
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# A newer push to the same PR cancels the run it supersedes. Pushes to main queue
# instead, so every commit on main gets a completed result (QA F-2).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      nonapi_tests: ${{ steps.plan.outputs.nonapi_tests }}
      api: ${{ steps.plan.outputs.api }}
      e2e: ${{ steps.plan.outputs.e2e }}
      agents: ${{ steps.plan.outputs.agents }}
      turbo_filter: ${{ steps.plan.outputs.turbo_filter }}
      test_filter: ${{ steps.plan.outputs.test_filter }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # History to find the merge base; blobs are fetched only as needed.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: plan
        run: node scripts/ci/changes.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  checks:
    name: typecheck, lint, test
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_FILTER: ${{ needs.changes.outputs.turbo_filter }}
      TEST_FILTER: ${{ needs.changes.outputs.test_filter }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No version input: the action reads "packageManager" from package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # .nvmrc holds "24" (latest 24.x). See README.md "CI" for why not 22.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TURBO_FILTER is empty on a full run, else --filter=<pkg> per affected package.
      - run: pnpm turbo run typecheck lint $TURBO_FILTER
      # Every affected package's tests except the api integration project, which
      # has its own job: run together on one runner, its Postgres containers slowed
      # the web tests past their 5 s timeout and the job past 30 minutes.
      - if: needs.changes.outputs.nonapi_tests == 'true'
        run: pnpm turbo run test $TEST_FILTER
      - if: needs.changes.outputs.api == 'true'
        run: pnpm --filter @eve/api test:unit
  api-integration:
    name: api integration tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # .nvmrc holds "24" (latest 24.x). See README.md "CI" for why not 22.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@eve/contracts
      # The api integration project starts its own postgres:17-alpine through
      # Testcontainers (apps/api/test/support/postgres-cluster.ts) on the runner's
      # Docker, creates the owner and runtime roles and migrates a template.
      # It takes no external database URL, so there is no service container.
      - run: pnpm --filter @eve/api test:int

  e2e:
    name: e2e (Playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # .nvmrc holds "24" (latest 24.x). See README.md "CI" for why not 22.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system dependencies
        run: pnpm --filter @eve/e2e exec playwright install --with-deps chromium
      # Global setup (apps/e2e/support/global-setup.ts) runs postgres:17-alpine with
      # `docker run`, builds and starts the api and starts Vite on port 5199.
      - run: pnpm turbo run e2e
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The checks job tests the api on the .nvmrc Node (24); production runs the
  # apps/api/Dockerfile image on node:22. This job builds that image and boots it
  # against a throwaway Postgres, so a change that breaks the shipped image fails CI (QA F-1).
  api-image:
    name: api image smoke (node:22)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/ci/api-image-smoke.sh
