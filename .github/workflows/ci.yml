# CI for pull requests and pushes to main. Checks only: no secrets, no deploys.
# Run the same commands locally: see the "CI" section of README.md.
#
# The changes job runs scripts/ci/changes.mjs first and the other jobs run only
# when the diff needs them: a docs-only change runs the agent checks alone, a
# web-only change skips the api integration and image jobs, and turbo filters to
# the changed packages and their dependents. The lockfile, root build config and
# this directory run everything. A nightly run checks all of main once a day it
# changed. See what a branch would run: node scripts/ci/changes.mjs --base origin/main
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# A newer push to the same PR cancels the run it supersedes. Pushes to main queue
# instead, so every commit on main gets a completed result (QA F-2).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      nonapi_tests: ${{ steps.plan.outputs.nonapi_tests }}
      api: ${{ steps.plan.outputs.api }}
      e2e: ${{ steps.plan.outputs.e2e }}
      agents: ${{ steps.plan.outputs.agents }}
      turbo_filter: ${{ steps.plan.outputs.turbo_filter }}
      test_filter: ${{ steps.plan.outputs.test_filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # History to find the merge base; blobs are fetched only as needed.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - id: plan
        run: node scripts/ci/changes.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  # The old single "typecheck, lint, test" job ran everything in series (p50 487 s). It is
  # now static + the unit jobs below, in parallel, and the `checks` aggregate keeps the
  # required name.
  static:
    name: typecheck + lint
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # p95 13.1 min + ~50%
    env:
      TURBO_FILTER: ${{ needs.changes.outputs.turbo_filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No version input: the action reads "packageManager" from package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # .nvmrc holds "24" (latest 24.x). See README.md "CI" for why not 22.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Runtime dependencies only; fails on a known high or critical advisory, which also stops a
      # Dependabot bump that pulls one in from auto-merging.
      - run: pnpm audit --prod --audit-level=high
      # TURBO_FILTER is empty on a full run, else --filter=<pkg> per affected package.
      - run: pnpm turbo run typecheck lint $TURBO_FILTER

  # Every affected package's tests except the api integration project, which has its own
  # job (run together on one runner, its Postgres containers slowed the web tests past
  # their 5 s timeout), and except web, which is the bulk of the time and is sharded.
  unit-other:
    name: unit tests (packages)
    needs: changes
    # Skipped when web is the only package in scope (a scoped filter never contains "!").
    if: >-
      needs.changes.outputs.nonapi_tests == 'true' &&
      needs.changes.outputs.test_filter != '--filter=@eve/web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_FILTER: ${{ needs.changes.outputs.test_filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No version input: the action reads "packageManager" from package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # .nvmrc holds "24" (latest 24.x). See README.md "CI" for why not 22.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # "!@eve/web" only subtracts: web runs in the unit-web shards.
      - run: pnpm turbo run test $TEST_FILTER --filter=!@eve/web

  unit-web:
    name: unit tests (web ${{ matrix.shard }}/4)
    needs: changes
    if: >-
      needs.changes.outputs.nonapi_tests == 'true' &&
      (contains(needs.changes.outputs.test_filter, '@eve/web') ||
      contains(needs.changes.outputs.test_filter, '!'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No version input: the action reads "packageManager" from package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # .nvmrc holds "24" (latest 24.x). See README.md "CI" for why not 22.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm turbo run test --filter=@eve/web -- --shard=${{ matrix.shard }}/4

  unit-api:
    name: unit tests (api)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No version input: the action reads "packageManager" from package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # .nvmrc holds "24" (latest 24.x). See README.md "CI" for why not 22.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm turbo run build --filter=@eve/contracts
      - run: pnpm --filter @eve/api test:unit

  # The required status check. It keeps the name "typecheck, lint, test" so the branch
  # ruleset does not change: green when every job above passed or was not needed for this change.
  checks:
    name: typecheck, lint, test
    needs: [changes, static, unit-other, unit-web, unit-api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks must pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done

  # Split by test file with vitest's --shard (plain i/N, not duration-balanced); every
  # shard is its own runner, so it starts its own Postgres container and cannot collide.
  api-integration-shard:
    name: api integration tests shard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18 # p95 11.8 min + ~50%
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # .nvmrc holds "24" (latest 24.x). See README.md "CI" for why not 22.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm turbo run build --filter=@eve/contracts
      # The api integration project starts its own postgres:17-alpine through
      # Testcontainers (apps/api/test/support/postgres-cluster.ts) on the runner's
      # Docker, creates the owner and runtime roles and migrates a template.
      # It takes no external database URL, so there is no service container.
      # The latency-budget spec runs alone in api-performance below: next to other files
      # on a shared runner its p95 swung past the 300 ms budget (CPU contention).
      - run: pnpm --filter @eve/api test:int --shard=${{ matrix.shard }}/4 --exclude '**/performance.epic-0006.int-spec.ts'

  # The p95 latency budget (300 ms, unchanged) is only meaningful without other test files
  # competing for CPU, so this spec has its own job and file-level parallelism is off.
  api-performance:
    name: api performance budget
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # .nvmrc holds "24" (latest 24.x). See README.md "CI" for why not 22.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm turbo run build --filter=@eve/contracts
      - run: pnpm --filter @eve/api exec vitest run --project integration --no-file-parallelism test/performance.epic-0006.int-spec.ts

  # The required status check. It keeps the name "api integration tests" so the branch
  # ruleset does not change: green when every shard passed or the api was not affected.
  api-integration:
    name: api integration tests
    needs: [changes, api-integration-shard, api-performance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All api integration shards and the performance budget must pass
        env:
          RESULTS: ${{ needs.api-integration-shard.result }} ${{ needs.api-performance.result }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done

  # The suite runs serially against one database, so it is split by test file across
  # runners; every shard starts its own Postgres, api and Vite (global-setup.ts).
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18 # p95 12.3 min + ~50%
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # .nvmrc holds "24" (latest 24.x). See README.md "CI" for why not 22.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Playwright's own Chromium (the tests assert on it: Google Chrome re-requests favicon.svg on history
      # changes and breaks the "no request" tests). Cached per Playwright version, so most runs skip the
      # download. System libraries come from the runner image, so no apt step (--with-deps took minutes).
      - id: pw
        run: echo "version=$(pnpm --filter @eve/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm --filter @eve/e2e exec playwright install chromium
      # Global setup (apps/e2e/support/global-setup.ts) runs postgres:17-alpine with
      # `docker run`, builds and starts the api and starts Vite on port 5199.
      - run: pnpm turbo run e2e -- --shard=${{ matrix.shard }}/4
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The required status check. It keeps the name "e2e (Playwright)" so the branch ruleset
  # does not change: green when every shard passed or e2e was not needed for this change.
  e2e:
    name: e2e (Playwright)
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All e2e shards must pass
        env:
          RESULT: ${{ needs.e2e-shard.result }}
          PLAN: ${{ needs.changes.result }}
        run: |
          echo "plan: $PLAN, shards: $RESULT"
          # If the plan job itself failed, the shards were skipped by accident, not by design.
          [ "$PLAN" = "success" ] || exit 1
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  # The checks job tests the api on the .nvmrc Node (24); production runs the
  # apps/api/Dockerfile image on node:24 (the job keeps its old name "(node:22)" because the branch
  # ruleset requires that exact check name). This job builds that image and boots it
  # against a throwaway Postgres, so a change that breaks the shipped image fails CI (QA F-1).
  api-image:
    name: api image smoke (node:22)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # p95 1.3 min, floored at 5 for registry/pull variance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/ci/api-image-smoke.sh
