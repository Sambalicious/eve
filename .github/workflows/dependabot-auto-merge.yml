# Turns on auto-merge for Dependabot's low-risk PRs; GitHub merges them only once the
# branch ruleset's required checks (the CI jobs) have passed. Anything else waits for a
# person: major bumps, Docker base images and compose digests can break the build or the
# runtime in ways a green CI run does not always show.
name: Dependabot auto-merge

on: pull_request_target

permissions: {}

jobs:
  auto-merge:
    name: enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No checkout: this job never runs code from the pull request.
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch and minor npm and Actions updates
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          (steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' ||
          steps.metadata.outputs.package-ecosystem == 'github_actions')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
