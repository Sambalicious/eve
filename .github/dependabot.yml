# Weekly update PRs. Minor and patch bumps are grouped into one PR per ecosystem
# so they are reviewed together; major bumps arrive as their own PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  # pnpm workspace: the root and every workspace package (apps/*, packages/*).
  # Dependabot's "npm" ecosystem reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directories:
      - /
      - /apps/*
      - /packages/*
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # apps/api/Dockerfile (node base image, pinned by digest).
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # Image references in the compose files (postgres, browser and egress digests).
  # docker/* holds no Dockerfiles; its compose files are covered here.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /docker/*
    schedule:
      interval: weekly
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
