# Weekly update PRs. Minor and patch bumps are grouped into one PR per ecosystem
# so they are reviewed together; major bumps arrive as their own PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it: a compromised or broken release is usually
    # yanked or flagged within days, and these PRs can auto-merge. Security updates ignore this.
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  # pnpm workspace (one root lockfile covers every package).
  # Dependabot's "npm" ecosystem reads pnpm-lock.yaml.
  - package-ecosystem: npm
    # One pnpm lockfile at the root: scanning each workspace as well only opened a
    # duplicate PR per package for the same bump.
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it: a compromised or broken release is usually
    # yanked or flagged within days, and these PRs can auto-merge. Security updates ignore this.
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the Node the code runs on (engines >=24.15, .nvmrc 24), not the latest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # 4.0.105 makes the Anthropic model unassignable to Mastra (api tsc and image build fail).
      # Drop this entry once a release newer than 4.0.105 builds against @mastra/core.
      - dependency-name: "@ai-sdk/anthropic"
        versions: ["4.0.105"]

  # apps/api/Dockerfile (node base image, pinned by digest).
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The shipped image stays on node 24 (see apps/api/Dockerfile); a new major is a deliberate upgrade.
      - dependency-name: node
        update-types: [version-update:semver-major]

  # Image references in the compose files (postgres, browser and egress digests).
  # docker/* holds no Dockerfiles; its compose files are covered here.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /docker/*
    schedule:
      interval: weekly
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
